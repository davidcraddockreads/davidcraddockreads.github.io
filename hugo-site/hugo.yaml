  socialIcons:
    - name: instagram
      title: My Instagram
      url: "https://instagram.com/djdavidcraddock"

  assets:
    disableHLJS: true
    disableFingerprinting: true

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    linkFullImages: true

markup:
  goldmark:
    backend: html5
    failureLevel: fatal
    noHeaderOrFooter: true
    preserveTOC: true
    sectionNumbers: false
    trace: false
    verbose: false
    workingFolderCurrent: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
  disqus:
    shortname: davidcraddocknet

