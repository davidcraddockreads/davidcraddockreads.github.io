baseURL: "https://davidcraddockreads.github.io/"
title: DavidCraddockReads.com
copyright: "© David Paul Craddock"
theme: PaperMod-dpc

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: true
buildFuture: true
buildExpired: true
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

frontmatter:
  date:
  - date
  - :git
  - :fileModTime

minify:
  disableXML: true
  minifyOutput: true

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Search
          url: search/
          weight: 10
        - name: GoodReads Inventory
          url: https://www.goodreads.com/user/show/22437975-david
          weight: 11
        - name: More
          url: https://davidcraddock.net
          weight: 12

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "DavidCraddockReads.com"
  author: David Craddock
  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  TocOpen: true # open contents automantically
  comments: true
  images: ["/mugshot.png"]
  social:
    github: wordswords
    instagram: djdavidcraddock


  profileMode:
    enabled: false

    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "DavidCraddockReads.com"

    Content:
      Hi, I'm David. This is the blog where I chart progress on the books that I read, and what I think about them. I am <a href="https://davidcraddock.net">David Craddock the technologist from Manchester</a>, UK. I am NOT the same person as the much more famous <a href="https://davidcraddockbooks.com">David L. Craddock</a>, although I do enjoy his gaming writing!
  If you need to contact me at any time, please use: <a href="mailto:3rp2mzocr@mozmail.com">3rp2mzocr@mozmail.com</a>.
      <img loading="lazy" style="object-fit:contain;max-width:100%;max-height:100%;width:127px;height:127px;" src="/mugshot.png" alt="A mugshot of me">

  socialIcons:
    - name: instagram
      title: My Instagram
      url: "https://instagram.com/djdavidcraddock"

  assets:
    disableHLJS: true
    disableFingerprinting: true

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
    linkFullImages: true

markup:
  goldmark:
    backend: html5
    failureLevel: fatal
    noHeaderOrFooter: true
    preserveTOC: true
    sectionNumbers: false
    trace: false
    verbose: false
    workingFolderCurrent: false
    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

services:
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
  disqus:
    shortname: davidcraddocknet

